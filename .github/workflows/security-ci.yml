name: Security CI Gate

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to scan commit history

      - name: Secret Scan (Gitleaks)
        # Gitleaks exits with code 1 by default if secrets are found
        run: docker run --rm -v "${{ github.workspace }}:/src" zricethezav/gitleaks:latest detect --source="/src" -v

      - name: SAST Scan (Semgrep)
        # The --error flag forces the step to fail if vulnerabilities are found
        run: docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config "p/default" --config "p/owasp-top-ten" --error /src

      - name: SCA Scan (Trivy)
        # --exit-code 1 and --severity HIGH,CRITICAL perfectly map to your Task 6 requirement
        run: docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy fs --severity HIGH,CRITICAL --exit-code 1 /src